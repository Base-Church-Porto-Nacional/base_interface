services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/base-church-porto-nacional/base_interface:latest}
    networks:
      - proxy
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M
      labels:
        traefik.enable: "true"
        traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
        traefik.swarm.network: ${TRAEFIK_NETWORK:-traefik-public}
        traefik.http.routers.base-web.rule: Host(`${WEB_HOST:-base.veigagustavo.com.br}`)
        traefik.http.routers.base-web.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
        traefik.http.routers.base-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
        traefik.http.services.base-web.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
